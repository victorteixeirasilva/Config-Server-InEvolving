##PROD
services:
  config-service:
    build:
      context: .
    container_name: config-service
    env_file:
      - ../.env
    environment:
      - PORT=8099  # ← Força o Spring Boot usar 8099 dentro do container
    ports:
      - "8099:8099"
    networks:
      - backend

networks:
  backend:
    external: true