name: Deploy Config Server QA to Render

on:
  push:
    branches:
      - QA
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para criar branch órfã

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Validar Secrets
        run: |
          echo "🔍 Validando secrets necessários..."
          
          if [ -z "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "❌ RENDER_API_KEY não configurado!"
            exit 1
          fi
          
          if [ -z "${{ secrets.RENDER_SERVICE_ID }}" ]; then
            echo "❌ RENDER_SERVICE_ID não configurado!"
            exit 1
          fi
          
          if [ -z "${{ secrets.GIT_TOKEN }}" ]; then
            echo "❌ GIT_TOKEN não configurado!"
            exit 1
          fi
          
          echo "✅ Todos os secrets estão configurados!"

      - name: Dar permissão ao mvnw
        working-directory: config-service
        run: chmod +x mvnw

      - name: Build com Maven
        working-directory: config-service
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          IN_EVOLVING_ENCRYPT_KEY: ${{ secrets.IN_EVOLVING_ENCRYPT_KEY }}
        run: |
          echo "🔨 Iniciando build do Config Server..."
          ./mvnw clean package -DskipTests
          
          echo "✅ Build concluído!"
          ls -lh target/*.jar
          
          # Salvar nome do JAR para usar depois
          JAR_NAME=$(ls target/*.jar | head -1 | xargs basename)
          echo "JAR_NAME=$JAR_NAME" >> $GITHUB_ENV
          echo "📦 JAR gerado: $JAR_NAME"

      - name: Preparar Artefatos para Render
        run: |
          echo "📦 Preparando artefatos para deploy..."
          
          # Criar diretório temporário
          mkdir -p render-deploy
          
          # Copiar JAR compilado
          cp config-service/target/*.jar render-deploy/app.jar
          
          echo "✅ JAR copiado: $(ls -lh render-deploy/app.jar)"
          
          # Criar Dockerfile otimizado (apenas copia JAR pronto)
          cat > render-deploy/Dockerfile << 'EOF'
          FROM eclipse-temurin:21-jre-alpine
          
          WORKDIR /app
          
          # Copiar JAR já compilado
          COPY app.jar app.jar
          
          # Variável de ambiente (Render sobrescreve automaticamente)
          ENV PORT=8099
          
          # Otimizações de memória para Render Free Tier (512 MB)
          ENV JAVA_OPTS="-Xmx300m -Xms128m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -Djava.security.egd=file:/dev/./urandom"
          
          # Expor porta (apenas documentação)
          EXPOSE ${PORT}
          
          # Entrypoint com flags de memória
          ENTRYPOINT ["sh", "-c", "java $JAVA_OPTS -jar app.jar"]
          EOF
          
          echo "✅ Dockerfile criado"
          cat render-deploy/Dockerfile
          
          # Criar .dockerignore
          cat > render-deploy/.dockerignore << 'EOF'
          .git
          .github
          *.md
          EOF
          
          echo "✅ Artefatos preparados!"
          ls -la render-deploy/

      - name: Deploy para Branch render-deploy
        run: |
          echo "🚀 Criando branch render-deploy..."
          
          # Configurar Git
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Criar/checkout branch render-deploy
          git checkout -B render-deploy
          
          # Remover todos os arquivos do stage (mas manter .git)
          git rm -rf . 2>/dev/null || true
          
          # Copiar apenas os arquivos necessários para o Render
          cp render-deploy/app.jar .
          cp render-deploy/Dockerfile .
          cp render-deploy/.dockerignore .
          
          # Adicionar arquivos
          git add -f app.jar Dockerfile .dockerignore
          
          # Verificar se há mudanças
          if git diff --staged --quiet; then
            echo "⚠️ Nenhuma mudança detectada. Pulando commit."
          else
            # Commit
            COMMIT_MSG="Deploy build $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git commit -m "$COMMIT_MSG"
            
            echo "✅ Commit criado: $COMMIT_MSG"
          fi
          
          # Push forçado para branch render-deploy
          git push -f origin render-deploy
          
          echo "✅ Branch render-deploy atualizada!"

      - name: Aguardar Propagação do Git
        run: |
          echo "⏳ Aguardando 10 segundos para propagação do Git..."
          sleep 10

      - name: Verificar Serviço no Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "🔍 Verificando serviço no Render..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
            -H "Authorization: Bearer $RENDER_API_KEY")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            SERVICE_NAME=$(echo "$BODY" | grep -o '"name":"[^"]*"' | head -1 | cut -d'"' -f4)
            BRANCH=$(echo "$BODY" | grep -o '"branch":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "✅ Serviço encontrado: $SERVICE_NAME"
            echo "📋 Branch configurada no Render: $BRANCH"
            
            if [ "$BRANCH" != "render-deploy" ]; then
              echo "⚠️ ATENÇÃO: Render está configurado para branch '$BRANCH'"
              echo "⚠️ Você precisa mudar para 'render-deploy' no Dashboard!"
              echo "🔗 https://dashboard.render.com/web/$RENDER_SERVICE_ID/settings"
            fi
          else
            echo "❌ Erro ao buscar serviço!"
            echo "HTTP Code: $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi

      - name: Trigger Deploy no Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "🚀 Iniciando deploy no Render..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "clear"}')
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" -eq 201 ]; then
            DEPLOY_ID=$(echo "$BODY" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "✅ Deploy iniciado com sucesso!"
            echo "📋 Deploy ID: $DEPLOY_ID"
            echo "🔗 Acompanhe em: https://dashboard.render.com/web/$RENDER_SERVICE_ID"
            echo "DEPLOY_ID=$DEPLOY_ID" >> $GITHUB_ENV
          else
            echo "❌ Erro ao iniciar deploy!"
            echo "HTTP Code: $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi

      - name: Aguardar Deploy Completar
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "⏳ Aguardando deploy completar..."
          echo "Isso pode levar 1-3 minutos (build é rápido agora!)..."
          
          MAX_WAIT=300  # 5 minutos
          ELAPSED=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            sleep 15
            ELAPSED=$((ELAPSED + 15))
            
            RESPONSE=$(curl -s \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/${{ env.DEPLOY_ID }}" \
              -H "Authorization: Bearer $RENDER_API_KEY")
            
            STATUS=$(echo "$RESPONSE" | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
            
            echo "[$ELAPSED s] Status: $STATUS"
            
            if [ "$STATUS" = "live" ]; then
              echo "✅ Deploy concluído com sucesso!"
              break
            elif [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "deactivated" ]; then
              echo "❌ Deploy falhou com status: $STATUS"
              echo "🔗 Verifique os logs: https://dashboard.render.com/web/$RENDER_SERVICE_ID"
              exit 1
            fi
          done
          
          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "⚠️ Timeout: Deploy ainda em progresso após 5 minutos"
            echo "🔗 Verifique manualmente: https://dashboard.render.com/web/$RENDER_SERVICE_ID"
            exit 1
          fi

      - name: Verificar Saúde do Serviço
        run: |
          echo "🧪 Testando Config Server..."
          
          SERVICE_URL="https://config-server-qa.onrender.com"
          
          MAX_RETRIES=10
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Tentativa $((RETRY_COUNT + 1)) de $MAX_RETRIES..."
            
            # Testar health check
            if curl -f -s "$SERVICE_URL/actuator/health" > /dev/null 2>&1; then
              echo "✅ Config Server está UP e respondendo!"
              echo "🔗 Health Check: $SERVICE_URL/actuator/health"
              
              # Testar endpoint de configuração (opcional)
              if curl -f -s "$SERVICE_URL/api/default" > /dev/null 2>&1; then
                echo "✅ Endpoint de configuração funcionando!"
                echo "🔗 Config Endpoint: $SERVICE_URL/api/default"
              else
                echo "⚠️ Endpoint /api/default retornou erro"
                echo "   (Isso é normal se não houver arquivo api.properties no Git)"
              fi
              
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⏳ Serviço ainda não está respondendo... Aguardando 15s"
                sleep 15
              fi
            fi
          done
          
          echo "❌ Serviço não respondeu após $MAX_RETRIES tentativas"
          echo "🔗 Verifique os logs: https://dashboard.render.com/web/${{ secrets.RENDER_SERVICE_ID }}"
          exit 1

      - name: Resumo do Deploy
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 RESUMO DO DEPLOY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏷️  Branch Source: QA"
          echo "🏷️  Branch Deploy: render-deploy"
          echo "🔧 Serviço: config-server-qa"
          echo "📦 JAR: ${{ env.JAR_NAME }}"
          echo "🔗 Dashboard: https://dashboard.render.com/web/${{ secrets.RENDER_SERVICE_ID }}"
          echo "🌐 URL: https://config-server-qa.onrender.com"
          echo "🏥 Health: https://config-server-qa.onrender.com/actuator/health"
          echo "📋 Config: https://config-server-qa.onrender.com/api/default"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "⚠️  LEMBRE-SE: Configure o Render para usar a branch 'render-deploy'"
          echo "🔗 Settings: https://dashboard.render.com/web/${{ secrets.RENDER_SERVICE_ID }}/settings"