name: Deploy Java Backend via SSH with Password

on:
  push:
    branches:
      - QA

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Instalar Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Criar arquivo .env a partir de secrets individuais
        run: |
          cat > .env << EOL
          GIT_USERNAME=${{ secrets.GIT_USERNAME }}
          GIT_TOKEN=${{ secrets.GIT_TOKEN }}
          IN_EVOLVING_ENCRYPT_KEY=${{ secrets.IN_EVOLVING_ENCRYPT_KEY }}
          EOL
          
          echo "✅ Arquivo .env criado com sucesso!"
          echo "📄 Conteúdo (sanitizado):"
          cat .env | sed 's/=.*/=***HIDDEN***/g'

      - name: Dar permissão ao mvnw
        working-directory: config-service
        run: chmod +x mvnw

      - name: Build com Maven
        working-directory: config-service
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          IN_EVOLVING_ENCRYPT_KEY: ${{ secrets.IN_EVOLVING_ENCRYPT_KEY }}
        run: ./mvnw clean package

      - name: Compactar pasta config-service e .env
        run: tar -cvf config-service.tar config-service/ .env

      - name: Instalar sshpass
        run: sudo apt-get install -y sshpass

      - name: Enviar .tar para VPS
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" scp -o StrictHostKeyChecking=no config-service.tar ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/config-service.tar

      - name: Executar comandos na VPS
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            
            # Definir variável DENTRO do SSH
            TARGET_DIR="/home/root/QA/Back-End/Config-Server-InEvolving"
            
            echo "🗑️  Limpando diretório anterior..."
            rm -rf "$TARGET_DIR/config-service"
            mkdir -p "$TARGET_DIR"
            
            echo "📦 Extraindo arquivos..."
            tar -xvf /tmp/config-service.tar -C "$TARGET_DIR"
            rm /tmp/config-service.tar
            
            echo "🔍 Verificando estrutura de pastas:"
            ls -la "$TARGET_DIR"
            
            echo "🔍 Verificando se .env foi extraído:"
            if [ -f "$TARGET_DIR/.env" ]; then
              echo "✅ Arquivo .env encontrado!"
            else
              echo "❌ ERRO: Arquivo .env não encontrado!"
              exit 1
            fi
            
            echo "🐳 Parando containers anteriores..."
            cd "$TARGET_DIR/config-service"
            docker compose down --volumes --remove-orphans config-service-qa || true
            
            echo "🚀 Iniciando novo container..."
            docker compose up -d config-service-qa
            
            echo "✅ Deploy concluído! Containers ativos:"
            docker ps --filter "name=config-service-qa"
            
            echo "📋 Logs do container (últimas 50 linhas):"
            docker logs config-service-qa --tail 50
          EOF